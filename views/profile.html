<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Your Account · Canopy</title>
<meta name="theme-color" content="#03120c">
<link rel="stylesheet" href="/account.css">
<style>
  .stack{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:40px;}
  .stack .card{max-width:none;}
  h3{font-size:15px;margin:0 0 4px;}
  .card > p.left{text-align:left;}
  /* A row in the passkeys list, and in where you're signed in. */
  .passkey, .session{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-top:1px solid var(--line);
  }
  .passkey:first-child, .session:first-child{border-top:none;}
  .passkey svg, .session svg{width:20px;height:20px;flex:0 0 auto;color:var(--accent);}
  .passkey .what, .session .what{flex:1;min-width:0;font-size:13px;line-height:1.35;}
  .passkey .what span, .session .what span{color:var(--muted);display:block;font-size:12px;}
  .passkey button, .session button{width:auto;padding:6px 10px;font-size:12px;border-radius:8px;}
  .email-line{color:var(--muted);font-size:13px;text-align:center;margin:0 0 16px;}
  /* The admin's way back to the Account Manager, over the page. */
  .page-head{max-width:400px;margin:0 auto 12px;min-height:18px;}
  .email-line .link-btn{margin-left:6px;}
  #emailSheet input.code{margin-bottom:12px;}
  .name-row .field{flex:1;min-width:0;}
  /* Confirm your email: on top, and with no way to close it. */
  .verify-banner{border-color:var(--accent);padding:18px 20px;}
  .verify-banner p{color:var(--text);margin:0 0 12px;}
  /* Whether a phone number or Instagram finds you: a checkbox and what
     it means, left-aligned under the fields it's about. */
  .find-me{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;text-align:left;margin:4px 0 4px;cursor:pointer;}
  .find-me input{width:18px;height:18px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent);}
  .find-hint{text-align:left;font-size:12px;margin:0 0 14px 28px;}
  /* Deleting your account: last on the page, and quiet until it's used. */
  .delete-card p{text-align:left;font-size:13px;color:var(--muted);margin:0 0 12px;}
  /* Your calendar feed: subscribe, copy the link, or replace it. */
  .calendar-card p{text-align:left;font-size:13px;margin:0 0 12px;}
  .calendar-buttons{display:flex;gap:8px;margin-top:8px;}
  .calendar-links{display:flex;justify-content:space-between;gap:12px;margin-top:12px;}
  .calendar-links a{color:var(--accent-text);font-size:13px;font-weight:600;text-decoration:none;}
  #deleteSheet input{margin-bottom:12px;}
  /* iPad and up: wider, with contact and payment fields side by side, so
     the form isn't one long column on a big screen. On a phone each
     field keeps its own line (two would be too cramped to type in). */
  @media (min-width:700px){
    .stack, .page-head{max-width:800px;}
    .field-row{display:flex;gap:16px;}
    .field-row .field{flex:1;min-width:0;}
    .name-row{gap:16px;}
  }
</style>
</head>
<!-- data-return: where ?verify=1 goes once the email is confirmed, and
     where ?claimed=1's Continue goes. The server already checked it's a
     Canopy page; empty means stay here. -->
<body class="mesh-bg" data-return="__RETURN_URL__">
  <header class="page-head">
    <a href="/admin" id="adminLink" class="nav-btn hidden" data-copy="profile.admin"></a>
  </header>
  <div class="stack">
    <!-- After signing in by code took an unverified account over
         (?claimed=1): check the name, which its maker typed. -->
    <div class="card verify-banner hidden" id="claimedBanner">
      <p data-copy="profile.claimedBanner"></p>
      <button type="button" id="claimedContinueBtn" class="hidden" data-copy="profile.claimedContinue"></button>
    </div>
    <div class="card verify-banner hidden" id="verifyBanner">
      <p data-copy="profile.verifyBanner"></p>
      <button type="button" id="verifyOpenBtn" data-copy="profile.verifyButton"></button>
    </div>
    <form class="card" id="profileForm">
      <!-- LOGO_IMG -->
      <h2 data-copy="profile.heading"></h2>
      <p class="email-line"><span id="emailLine"></span><button type="button" class="link-btn" id="changeEmailBtn" data-copy="profile.changeEmail"></button></p>
      <div class="notice" id="emailNotice"></div>
      <label class="photo-pick" id="photoPick">
        <span class="photo-circle">
          <img class="hidden" alt="">
          <svg class="placeholder" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="24" r="13" fill="currentColor"/>
            <path d="M8 64c0-14 10.7-24 24-24s24 10 24 24z" fill="currentColor"/>
          </svg>
        </span>
        <span class="photo-badge" aria-hidden="true">
          <svg class="icon-add" viewBox="0 0 14 14"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <svg class="icon-edit" viewBox="0 0 14 14"><path d="M2 12l.6-3L9.4 2.2a1.4 1.4 0 0 1 2 0l.4.4a1.4 1.4 0 0 1 0 2L5 11.4z" fill="currentColor"/></svg>
        </span>
        <input type="file" accept="image/*" aria-label="Change your photo">
      </label>
      <!-- Labelled above each box, so what a box is stays said once it's
           filled in. -->
      <div class="name-row">
        <div class="field">
          <label class="field-label" for="firstName" data-copy="profile.firstName"></label>
          <input type="text" id="firstName" autocomplete="given-name" maxlength="60">
        </div>
        <div class="field">
          <label class="field-label" for="lastName" data-copy="profile.lastName"></label>
          <input type="text" id="lastName" autocomplete="family-name" maxlength="60">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="phone" data-copy="profile.phone"></label>
          <input type="tel" id="phone" inputmode="tel" autocomplete="tel" maxlength="25">
        </div>
        <div class="field">
          <label class="field-label" for="instagram" data-copy="profile.instagram"></label>
          <label class="handle-field">
            <span class="handle-prefix" aria-hidden="true">@</span>
            <input type="text" id="instagram" maxlength="100"
              autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          </label>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="venmoHandle" data-copy="profile.venmo"></label>
          <label class="handle-field">
            <span class="handle-prefix" aria-hidden="true">@</span>
            <input type="text" id="venmoHandle" maxlength="30"
              autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          </label>
        </div>
        <div class="field">
          <label class="field-label" for="cashapp" data-copy="profile.cashapp"></label>
          <label class="handle-field">
            <span class="handle-prefix" aria-hidden="true">$</span>
            <input type="text" id="cashapp" maxlength="21"
              autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          </label>
        </div>
      </div>
      <label class="find-me"><input type="checkbox" id="findable"><span data-copy="profile.findable"></span></label>
      <p class="find-hint" data-copy="profile.findableHint"></p>
      <div class="error" id="profileError"></div>
      <div class="notice" id="profileNotice"></div>
      <button type="submit" id="saveBtn">Save</button>
    </form>

    <!-- Your Canopy calendar: one link a calendar app subscribes to, with
         everything you host or are going to on every Canopy site. Made
         the first time this loads (/api/profile/calendar). -->
    <div class="card calendar-card" id="calendarCard">
      <h3 data-copy="profile.calendarHeading"></h3>
      <p data-copy="profile.calendarHint"></p>
      <button type="button" id="calendarAddBtn" data-copy="profile.calendarAdd"></button>
      <div class="calendar-buttons">
        <button type="button" class="secondary" id="calendarCopyBtn" data-copy="profile.calendarCopy"></button>
      </div>
      <div class="calendar-links">
        <a href="#" id="calendarGoogle" target="_blank" rel="noopener noreferrer" data-copy="profile.calendarGoogle"></a>
        <button type="button" class="link-btn" id="calendarResetBtn" data-copy="profile.calendarReset"></button>
      </div>
      <div class="notice" id="calendarNotice"></div>
      <div class="error" id="calendarError"></div>
    </div>

    <div class="card">
      <h3 data-copy="profile.passkeysHeading"></h3>
      <div id="passkeyList"></div>
      <div class="error" id="passkeyError"></div>
      <div class="notice" id="passkeyNotice"></div>
      <button type="button" class="secondary passkey-btn" id="addPasskeyBtn" data-copy="profile.addPasskey"></button>
    </div>

    <div class="card">
      <h3 data-copy="profile.sessionsHeading"></h3>
      <div id="sessionList"></div>
      <div class="error" id="sessionError"></div>
      <button type="button" class="secondary" id="signOutEverywhereBtn" data-copy="profile.signOutEverywhere"></button>
    </div>

    <button type="button" class="danger" id="signOutBtn" data-copy="profile.signOut"></button>

    <!-- Deleting your own account: the admin's delete, done by you, behind
         your passkey and typing DELETE. Not for the admin (it would leave
         nobody to run Canopy accounts), who sees why instead. -->
    <div class="card delete-card">
      <h3 data-copy="profile.deleteHeading"></h3>
      <p id="deleteHint" data-copy="profile.deleteHint"></p>
      <button type="button" class="secondary" id="deleteOpenBtn" data-copy="profile.deleteButton"></button>
    </div>
  </div>

<!-- Deleting your account: your passkey, then DELETE typed out. The server
     only needs the passkey check (see "Deleting your own account" in
     server.js); typing it is so it can't be done by a slip of the thumb. -->
<div class="sheet-bg hidden" id="deleteSheet">
  <div class="card">
    <h2 data-copy="profile.deleteSheetHeading"></h2>
    <div id="deleteStepPasskey">
      <p data-copy="profile.deletePasskeyHint"></p>
      <div class="error" id="deletePasskeyError"></div>
      <button type="button" class="passkey-btn" id="deleteReauthBtn" data-copy="profile.changeEmailPasskey"></button>
    </div>
    <form id="deleteStepConfirm" class="hidden">
      <p data-copy="profile.deleteConfirmHint"></p>
      <div class="error" id="deleteConfirmError"></div>
      <input type="text" id="deleteWord" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DELETE">
      <button type="submit" class="danger" id="deleteFinalBtn" data-copy="profile.deleteFinal" disabled></button>
    </form>
    <p style="margin:14px 0 0"><button type="button" class="link-btn" onclick="closeDeleteSheet()">Cancel</button></p>
  </div>
</div>

<!-- Changing your email, one step at a time: your passkey, the new
     address, the code sent to it. The server holds each step to the one
     before (see "Changing your own email" in server.js). -->
<div class="sheet-bg hidden" id="emailSheet">
  <div class="card">
    <h2 data-copy="profile.changeEmailHeading"></h2>
    <div id="stepPasskey">
      <p data-copy="profile.changeEmailPasskeyHint"></p>
      <div class="error" id="passkeyStepError"></div>
      <button type="button" class="passkey-btn" id="reauthBtn" data-copy="profile.changeEmailPasskey"></button>
    </div>
    <form id="stepAddress" class="hidden">
      <p data-copy="profile.changeEmailAddressHint"></p>
      <div class="error" id="addressError"></div>
      <input type="email" id="newEmail" placeholder="New email" autocomplete="email" autocapitalize="off" spellcheck="false">
      <button type="submit" id="sendCodeBtn" data-copy="profile.changeEmailSend"></button>
    </form>
    <form id="stepCode" class="hidden">
      <p id="codeHint"></p>
      <div class="error" id="codeError"></div>
      <input type="text" class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
      <button type="submit" id="codeBtn">Continue</button>
    </form>
    <p style="margin:14px 0 0"><button type="button" class="link-btn" onclick="closeEmailSheet()">Cancel</button></p>
  </div>
</div>

<!-- Confirming your email: a code to it, typed back. -->
<div class="sheet-bg hidden" id="verifySheet">
  <div class="card">
    <h2 data-copy="profile.verifyHeading"></h2>
    <div id="verifyStepSend">
      <p id="verifyHint"></p>
      <div class="error" id="verifySendError"></div>
      <button type="button" id="verifySendBtn" data-copy="profile.verifySend"></button>
    </div>
    <form id="verifyStepCode" class="hidden">
      <p id="verifyCodeHint"></p>
      <div class="error" id="verifyCodeError"></div>
      <div class="notice" id="verifyCodeNotice"></div>
      <input type="text" class="code" id="verifyCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
      <button type="submit" id="verifyCodeBtn">Continue</button>
      <p style="margin:14px 0 0"><button type="button" class="link-btn" id="verifyResendBtn" data-copy="welcome.resend"></button></p>
    </form>
    <p style="margin:14px 0 0"><button type="button" class="link-btn" onclick="closeVerifySheet()">Cancel</button></p>
  </div>
</div>

<script src="/copy.js"></script>
<script src="/vendor/cropperjs-1.6.3/cropper.min.js"></script>
<script src="/photo-crop.js"></script>
<script src="/vendor/simplewebauthn-browser-14.0.0/index.umd.min.js"></script>
<script src="/account.js"></script>
<script>
applyCopy();

const KEY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M15.5 2.75a5.75 5.75 0 1 1-3.1 10.6l-1.15 1.15 1.4 1.4a1 1 0 0 1-1.42 1.42l-1.4-1.4-1.1 1.1 1.9 1.9a1 1 0 0 1-1.42 1.42l-1.9-1.9-2.6 2.6a1 1 0 0 1-1.42-1.42l7.3-7.3A5.75 5.75 0 0 1 15.5 2.75zm1.25 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>';

function signedOut(res){
  if (res.status === 401){ window.location.href = '/'; return true; }
  return false;
}

// +14155551234 as (415) 555-1234; any other country as stored.
function formatPhone(phone){
  if (!phone) return '';
  const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(phone);
  return m ? '(' + m[1] + ') ' + m[2] + '-' + m[3] : phone;
}

let me = null;
function fill(person){
  me = person;
  document.getElementById('verifyBanner').classList.toggle('hidden', !!person.emailVerified);
  document.getElementById('emailLine').textContent = person.email;
  document.getElementById('firstName').value = person.firstName;
  document.getElementById('lastName').value = person.lastName;
  document.getElementById('venmoHandle').value = person.venmo || '';
  document.getElementById('phone').value = formatPhone(person.phone);
  document.getElementById('instagram').value = person.instagram || '';
  document.getElementById('cashapp').value = person.cashapp || '';
  document.getElementById('findable').checked = !!person.findable;
  document.getElementById('adminLink').classList.toggle('hidden', !person.isAdmin);
  // The admin can't delete their own account (the server refuses too).
  document.getElementById('deleteOpenBtn').classList.toggle('hidden', !!person.isAdmin);
  document.getElementById('deleteHint').textContent = t(person.isAdmin ? 'profile.deleteAdmin' : 'profile.deleteHint');
  if (person.photoUrl) picker.show(person.photoUrl);
}

// A new photo goes up as soon as it's framed.
const picker = wirePhotoPicker(document.getElementById('photoPick'), document.getElementById('profileError'), async (blob) => {
  const errorEl = document.getElementById('profileError');
  const notice = document.getElementById('profileNotice');
  notice.textContent = '';
  try{
    const form = new FormData();
    form.append('photo', blob, 'photo.jpg');
    const res = await fetch('/api/profile/photo', { method: 'POST', body: form });
    if (signedOut(res)) return;
    if (!res.ok){ errorEl.textContent = t('profile.failed'); return; }
    notice.textContent = t('profile.saved');
  }catch(err){
    errorEl.textContent = t('welcome.unreachable');
  }
});

// Typing or pasting the sign does nothing -- the box already shows it.
[['venmoHandle', /@/g], ['instagram', /^@+/], ['cashapp', /\$/g]].forEach(([id, sign]) => {
  document.getElementById(id).addEventListener('input', (e) => {
    const v = e.target.value.replace(sign, '');
    if (v !== e.target.value) e.target.value = v;
  });
});

document.getElementById('profileForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('profileError');
  const notice = document.getElementById('profileNotice');
  notice.textContent = '';
  busy(document.getElementById('saveBtn'), errorEl, async () => {
    const { res, data } = await sendJson('PATCH', '/api/profile', {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      venmoHandle: document.getElementById('venmoHandle').value,
      phone: document.getElementById('phone').value,
      instagram: document.getElementById('instagram').value,
      cashapp: document.getElementById('cashapp').value,
      findable: document.getElementById('findable').checked
    });
    if (signedOut(res)) return;
    if (data.reason === 'bad_venmo'){ errorEl.textContent = t('welcome.badVenmo'); return; }
    if (data.reason === 'bad_phone'){ errorEl.textContent = t('profile.badPhone'); return; }
    if (data.reason === 'bad_instagram'){ errorEl.textContent = t('profile.badInstagram'); return; }
    if (data.reason === 'bad_cashapp'){ errorEl.textContent = t('profile.badCashapp'); return; }
    if (!res.ok){ errorEl.textContent = data.error === 'first and last name are both required' ? t('welcome.nameRequired') : t('profile.failed'); return; }
    fill(data.person);
    notice.textContent = t('profile.saved');
  });
});

// ---------------- Passkeys ----------------

async function loadPasskeys(){
  const res = await fetch('/api/profile/passkeys');
  if (signedOut(res)) return;
  const { passkeys } = await res.json();
  const list = document.getElementById('passkeyList');
  list.innerHTML = '';
  passkeys.forEach((k) => {
    const row = document.createElement('div');
    row.className = 'passkey';
    row.innerHTML = KEY_ICON + '<div class="what"></div>';
    const what = row.querySelector('.what');
    what.textContent = t('profile.passkeyAdded', { date: formatDate(k.createdAt) });
    const sub = document.createElement('span');
    sub.textContent = [
      k.lastUsedAt ? t('profile.passkeyUsed', { date: formatDate(k.lastUsedAt) }) : t('profile.passkeyNeverUsed'),
      t(k.synced ? 'profile.passkeySynced' : 'profile.passkeyDeviceOnly')
    ].join(' · ');
    what.appendChild(sub);
    if (passkeys.length > 1){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'danger';
      btn.textContent = 'Remove';
      btn.addEventListener('click', () => removePasskey(k.id, btn));
      row.appendChild(btn);
    }
    list.appendChild(row);
  });
}

function removePasskey(id, btn){
  if (!confirm(t('profile.removeConfirm'))) return;
  const errorEl = document.getElementById('passkeyError');
  document.getElementById('passkeyNotice').textContent = '';
  busy(btn, errorEl, async () => {
    const { res, data } = await sendJson('DELETE', '/api/profile/passkeys/' + encodeURIComponent(id));
    if (signedOut(res)) return;
    if (data.reason === 'last_passkey'){ errorEl.textContent = t('profile.lastPasskey'); return; }
    if (!res.ok){ errorEl.textContent = t('profile.failed'); return; }
    loadPasskeys();
  });
}

document.getElementById('addPasskeyBtn').addEventListener('click', (e) => {
  const errorEl = document.getElementById('passkeyError');
  const notice = document.getElementById('passkeyNotice');
  notice.textContent = '';
  busy(e.currentTarget, errorEl, async () => {
    const { res, data } = await postJson('/api/auth/register/add');
    if (signedOut(res)) return;
    if (!res.ok){ errorEl.textContent = t('welcome.failed') + detail(data.error || res.status); return; }
    if (await finishRegistration(data.options, errorEl)){
      notice.textContent = t('profile.added');
      loadPasskeys();
    }
  });
});

// ---------------- Your calendar ----------------
// The feed's link, made the first time this asks. "Add to Calendar" opens
// it as webcal://, which the phone's or the computer's calendar app
// subscribes to; Google Calendar on the web needs its own page for that.
let calendarLink = null;

function showCalendar(cal){
  calendarLink = cal;
  document.getElementById('calendarGoogle').href = 'https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(cal.webcalUrl);
}

async function loadCalendar(){
  const res = await fetch('/api/profile/calendar');
  if (signedOut(res)) return;
  if (!res.ok){ document.getElementById('calendarError').textContent = t('welcome.failed') + detail(res.status); return; }
  showCalendar((await res.json()).calendar);
}

document.getElementById('calendarAddBtn').addEventListener('click', () => {
  if (calendarLink) window.location.href = calendarLink.webcalUrl;
});

document.getElementById('calendarCopyBtn').addEventListener('click', async () => {
  if (!calendarLink) return;
  const notice = document.getElementById('calendarNotice');
  try{
    await navigator.clipboard.writeText(calendarLink.url);
    notice.textContent = t('profile.calendarCopied');
  }catch(e){
    // No clipboard (an old browser, or not allowed): show it to copy by hand.
    window.prompt(t('profile.calendarCopyPrompt'), calendarLink.url);
  }
});

document.getElementById('calendarResetBtn').addEventListener('click', (e) => {
  if (!confirm(t('profile.calendarResetConfirm'))) return;
  const notice = document.getElementById('calendarNotice');
  notice.textContent = '';
  busy(e.currentTarget, document.getElementById('calendarError'), async () => {
    const { res, data } = await postJson('/api/profile/calendar/reset');
    if (signedOut(res)) return;
    if (!res.ok){ document.getElementById('calendarError').textContent = t('welcome.failed') + detail(data.error || res.status); return; }
    showCalendar(data.calendar);
    notice.textContent = t('profile.calendarResetDone');
  });
});

// ---------------- Where you're signed in ----------------

const DEVICE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 2h8a2.5 2.5 0 0 1 2.5 2.5v15A2.5 2.5 0 0 1 16 22H8a2.5 2.5 0 0 1-2.5-2.5v-15A2.5 2.5 0 0 1 8 2zm0 2a.5.5 0 0 0-.5.5v15a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-15A.5.5 0 0 0 16 4zm2.5 13h3a1 1 0 0 1 0 2h-3a1 1 0 0 1 0-2z"/></svg>';

async function loadSessions(){
  const res = await fetch('/api/profile/sessions');
  if (signedOut(res)) return;
  const { sessions } = await res.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  sessions.forEach((s) => {
    const row = document.createElement('div');
    row.className = 'session';
    row.innerHTML = DEVICE_ICON + '<div class="what"></div>';
    const what = row.querySelector('.what');
    what.textContent = s.name || t(s.kind === 'ios' ? 'profile.sessionIos' : s.kind === 'android' ? 'profile.sessionAndroid' : 'profile.sessionBrowser');
    const sub = document.createElement('span');
    sub.textContent = s.current ? t('profile.sessionThis') : t('profile.sessionSeen', { date: formatDate(s.lastSeenAt) });
    what.appendChild(sub);
    if (!s.current){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'danger';
      btn.textContent = t('profile.sessionSignOut');
      btn.addEventListener('click', () => endSession(s.id, btn));
      row.appendChild(btn);
    }
    list.appendChild(row);
  });
}

function endSession(id, btn){
  busy(btn, document.getElementById('sessionError'), async () => {
    const { res } = await sendJson('DELETE', '/api/profile/sessions/' + encodeURIComponent(id));
    if (signedOut(res)) return;
    loadSessions();
  });
}

document.getElementById('signOutEverywhereBtn').addEventListener('click', (e) => {
  if (!confirm(t('profile.signOutEverywhereConfirm'))) return;
  busy(e.currentTarget, document.getElementById('sessionError'), async () => {
    await postJson('/api/signout/everywhere');
    window.location.href = '/';
  });
});

// ---------------- Changing your email ----------------
const STEPS = ['stepPasskey', 'stepAddress', 'stepCode'];
function showStep(id){
  STEPS.forEach((step) => document.getElementById(step).classList.toggle('hidden', step !== id));
  ['passkeyStepError', 'addressError', 'codeError'].forEach((e) => { document.getElementById(e).textContent = ''; });
}
function closeEmailSheet(){
  document.getElementById('emailSheet').classList.add('hidden');
}
document.getElementById('emailSheet').addEventListener('click', (e) => { if (e.target.id === 'emailSheet') closeEmailSheet(); });

document.getElementById('changeEmailBtn').addEventListener('click', () => {
  document.getElementById('emailNotice').textContent = '';
  document.getElementById('newEmail').value = '';
  showStep('stepPasskey');
  document.getElementById('emailSheet').classList.remove('hidden');
});

// 1. Your passkey, with Face ID or the like.
document.getElementById('reauthBtn').addEventListener('click', (e) => {
  const errorEl = document.getElementById('passkeyStepError');
  busy(e.currentTarget, errorEl, async () => {
    const start = await postJson('/api/auth/reauth/options');
    if (signedOut(start.res)) return;
    if (!start.res.ok){ errorEl.textContent = t('welcome.failed') + detail(start.data.error || start.res.status); return; }
    let response;
    try{
      response = await startAuthentication({ optionsJSON: start.data.options });
    }catch(err){
      errorEl.textContent = passkeyErrorText(err);
      return;
    }
    const { res, data } = await postJson('/api/auth/reauth/verify', { response });
    if (!res.ok){ errorEl.textContent = t('profile.changeEmailPasskeyFailed') + detail(data.error || res.status); return; }
    showStep('stepAddress');
    document.getElementById('newEmail').focus();
  });
});

// The passkey check has run out (15 minutes, one change): start over.
function backToPasskey(){
  showStep('stepPasskey');
  document.getElementById('passkeyStepError').textContent = t('profile.changeEmailAgain');
}

// 2. The new address, which gets a code.
let newEmail = '';
async function sendChangeCode(errorEl){
  const { res, data } = await postJson('/api/profile/email/start', { email: document.getElementById('newEmail').value });
  if (signedOut(res)) return false;
  if (data.reason === 'reauth_required'){ backToPasskey(); return false; }
  if (res.ok){ newEmail = data.email; return true; }
  errorEl.textContent = data.reason === 'bad_email' ? t('welcome.badEmail')
    : data.reason === 'same_email' ? t('profile.sameEmail')
    : data.reason === 'email_unavailable' ? t('profile.emailUnavailable')
    : data.reason === 'mail_failed' ? t('welcome.mailFailed')
    : res.status === 429 ? t('welcome.tooMany')
    : t('welcome.failed') + detail(data.error || res.status);
  return false;
}
document.getElementById('stepAddress').addEventListener('submit', (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('addressError');
  busy(document.getElementById('sendCodeBtn'), errorEl, async () => {
    if (!(await sendChangeCode(errorEl))) return;
    document.getElementById('codeHint').textContent = t('welcome.codeHint', { email: newEmail });
    document.getElementById('code').value = '';
    showStep('stepCode');
    document.getElementById('code').focus();
  });
});

// 3. The code, typed back. Then it's the email.
document.getElementById('code').addEventListener('input', (e) => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (v !== e.target.value) e.target.value = v;
  if (v.length === 6) document.getElementById('stepCode').requestSubmit();
});
document.getElementById('stepCode').addEventListener('submit', (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('codeError');
  busy(document.getElementById('codeBtn'), errorEl, async () => {
    const { res, data } = await postJson('/api/profile/email/verify', { code: document.getElementById('code').value });
    if (signedOut(res)) return;
    if (data.reason === 'reauth_required'){ backToPasskey(); return; }
    if (!res.ok){
      errorEl.textContent = data.reason === 'wrong_code' ? t('welcome.wrongCode')
        : data.reason === 'expired' ? t('welcome.codeExpired')
        : data.reason === 'email_unavailable' ? t('profile.emailUnavailable')
        : res.status === 429 ? t('welcome.tooMany')
        : t('welcome.failed') + detail(data.error || res.status);
      return;
    }
    closeEmailSheet();
    fill(data.person);
    document.getElementById('emailNotice').textContent = t('profile.emailChanged');
  });
});

// ---------------- Confirming your email ----------------
// For a quick sign-up, or an email the admin changed. ?verify=1 (where a
// site sends someone it won't let in yet) opens this straight away, and
// ?return= is where to go once it's done.
const RETURN_URL = document.body.getAttribute('data-return');

function openVerifySheet(){
  document.getElementById('verifyHint').textContent = t('profile.verifyHint', { email: me.email });
  ['verifySendError', 'verifyCodeError', 'verifyCodeNotice'].forEach((e) => { document.getElementById(e).textContent = ''; });
  document.getElementById('verifyStepSend').classList.remove('hidden');
  document.getElementById('verifyStepCode').classList.add('hidden');
  document.getElementById('verifySheet').classList.remove('hidden');
}
function closeVerifySheet(){
  document.getElementById('verifySheet').classList.add('hidden');
}
document.getElementById('verifySheet').addEventListener('click', (e) => { if (e.target.id === 'verifySheet') closeVerifySheet(); });
document.getElementById('verifyOpenBtn').addEventListener('click', openVerifySheet);

// True once a code is on its way (or there's nothing to confirm).
async function sendVerifyCode(errorEl){
  const { res, data } = await postJson('/api/profile/verify/start');
  if (signedOut(res)) return false;
  if (res.ok && data.verified){ verifiedNow(me); return false; }
  if (res.ok) return true;
  errorEl.textContent = data.reason === 'mail_failed' ? t('welcome.mailFailed')
    : res.status === 429 ? t('welcome.tooMany')
    : t('welcome.failed') + detail(data.error || res.status);
  return false;
}

document.getElementById('verifySendBtn').addEventListener('click', (e) => {
  const errorEl = document.getElementById('verifySendError');
  busy(e.currentTarget, errorEl, async () => {
    if (!(await sendVerifyCode(errorEl))) return;
    document.getElementById('verifyCodeHint').textContent = t('welcome.codeHint', { email: me.email });
    document.getElementById('verifyCode').value = '';
    document.getElementById('verifyStepSend').classList.add('hidden');
    document.getElementById('verifyStepCode').classList.remove('hidden');
    document.getElementById('verifyCode').focus();
  });
});

document.getElementById('verifyResendBtn').addEventListener('click', (e) => {
  const errorEl = document.getElementById('verifyCodeError');
  const notice = document.getElementById('verifyCodeNotice');
  notice.textContent = '';
  busy(e.currentTarget, errorEl, async () => {
    if (await sendVerifyCode(errorEl)) notice.textContent = t('welcome.resent');
  });
});

document.getElementById('verifyCode').addEventListener('input', (e) => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (v !== e.target.value) e.target.value = v;
  if (v.length === 6) document.getElementById('verifyStepCode').requestSubmit();
});

document.getElementById('verifyStepCode').addEventListener('submit', (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('verifyCodeError');
  document.getElementById('verifyCodeNotice').textContent = '';
  busy(document.getElementById('verifyCodeBtn'), errorEl, async () => {
    const { res, data } = await postJson('/api/profile/verify/check', { code: document.getElementById('verifyCode').value });
    if (signedOut(res)) return;
    if (!res.ok){
      errorEl.textContent = data.reason === 'wrong_code' ? t('welcome.wrongCode')
        : data.reason === 'expired' ? t('welcome.codeExpired')
        : res.status === 429 ? t('welcome.tooMany')
        : t('welcome.failed') + detail(data.error || res.status);
      return;
    }
    verifiedNow(data.person);
  });
});

// Confirmed: back to the site that asked, or stay here and say so.
function verifiedNow(person){
  if (RETURN_URL){ window.location.href = RETURN_URL; return; }
  closeVerifySheet();
  fill(person);
  document.getElementById('emailNotice').textContent = t('profile.verified');
}

// ---------------- Deleting your account ----------------
function closeDeleteSheet(){
  document.getElementById('deleteSheet').classList.add('hidden');
}
function showDeleteStep(confirming){
  document.getElementById('deleteStepPasskey').classList.toggle('hidden', confirming);
  document.getElementById('deleteStepConfirm').classList.toggle('hidden', !confirming);
  ['deletePasskeyError', 'deleteConfirmError'].forEach((e) => { document.getElementById(e).textContent = ''; });
}
document.getElementById('deleteSheet').addEventListener('click', (e) => { if (e.target.id === 'deleteSheet') closeDeleteSheet(); });
document.getElementById('deleteOpenBtn').addEventListener('click', () => {
  document.getElementById('deleteWord').value = '';
  document.getElementById('deleteFinalBtn').disabled = true;
  showDeleteStep(false);
  document.getElementById('deleteSheet').classList.remove('hidden');
});

// 1. Your passkey, with Face ID or the like: the same check as changing
// your email.
document.getElementById('deleteReauthBtn').addEventListener('click', (e) => {
  const errorEl = document.getElementById('deletePasskeyError');
  busy(e.currentTarget, errorEl, async () => {
    const start = await postJson('/api/auth/reauth/options');
    if (signedOut(start.res)) return;
    if (!start.res.ok){ errorEl.textContent = t('welcome.failed') + detail(start.data.error || start.res.status); return; }
    let response;
    try{
      response = await startAuthentication({ optionsJSON: start.data.options });
    }catch(err){
      errorEl.textContent = passkeyErrorText(err);
      return;
    }
    const { res, data } = await postJson('/api/auth/reauth/verify', { response });
    if (!res.ok){ errorEl.textContent = t('profile.changeEmailPasskeyFailed') + detail(data.error || res.status); return; }
    showDeleteStep(true);
    document.getElementById('deleteWord').focus();
  });
});

// 2. DELETE, typed out. Then it's gone, and so is this browser's session.
function deleteWordTyped(){
  return document.getElementById('deleteWord').value.trim().toUpperCase() === 'DELETE';
}
document.getElementById('deleteWord').addEventListener('input', () => {
  document.getElementById('deleteFinalBtn').disabled = !deleteWordTyped();
});
document.getElementById('deleteStepConfirm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!deleteWordTyped()) return;
  const errorEl = document.getElementById('deleteConfirmError');
  busy(document.getElementById('deleteFinalBtn'), errorEl, async () => {
    const { res, data } = await sendJson('DELETE', '/api/profile');
    if (signedOut(res)) return;
    if (data.reason === 'reauth_required'){
      showDeleteStep(false);
      document.getElementById('deletePasskeyError').textContent = t('profile.changeEmailAgain');
      return;
    }
    if (!res.ok){
      errorEl.textContent = data.reason === 'is_admin' ? t('profile.deleteAdmin') : t('welcome.failed') + detail(data.error || res.status);
      return;
    }
    window.location.href = '/';
  });
});

document.getElementById('signOutBtn').addEventListener('click', (e) => {
  busy(e.currentTarget, null, async () => {
    await postJson('/api/signout');
    window.location.href = '/';
  });
});

(async function load(){
  const res = await fetch('/api/me');
  const { person } = await res.json();
  if (!person){ window.location.href = '/'; return; }
  fill(person);
  loadCalendar();
  loadPasskeys();
  loadSessions();
  if (new URLSearchParams(window.location.search).has('verify')){
    if (!person.emailVerified) openVerifySheet();
    else if (RETURN_URL) window.location.href = RETURN_URL;
  }
  if (new URLSearchParams(window.location.search).has('claimed')){
    document.getElementById('claimedBanner').classList.remove('hidden');
    document.getElementById('claimedContinueBtn').classList.toggle('hidden', !RETURN_URL);
    document.getElementById('firstName').focus();
  }
})();

document.getElementById('claimedContinueBtn').addEventListener('click', () => {
  if (RETURN_URL) window.location.href = RETURN_URL;
});
</script>
</body>
</html>
