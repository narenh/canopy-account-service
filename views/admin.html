<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Account Manager · Canopy</title>
<meta name="theme-color" content="#03120c">
<link rel="stylesheet" href="/account.css">
<style>
  /* Always a scrollbar's room, so switching tabs doesn't shift the page
     sideways on desktop (tickets' fix). */
  html{overflow-y:scroll;}
  .wrap{max-width:640px;margin:0 auto;padding-bottom:40px;}
  /* The logo top left and the link to your own account top right, the
     title under them. */
  header{margin-bottom:14px;}
  header .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  header .site-logo{margin:0;max-height:40px;}
  /* The sheet for editing someone: the profile page's fields. */
  .edit-card{max-height:calc(100vh - 40px);overflow-y:auto;}
  .edit-card .name-row{display:flex;gap:10px;}
  .edit-card .name-row .field{flex:1;min-width:0;}
  header h1{margin:0;text-align:left;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tabs button{
    width:auto;background:none;color:var(--muted);border-radius:0;padding:10px 12px;font-size:14px;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tabs button.active{color:var(--on-bg);border-bottom-color:var(--on-bg);}
  /* On the bright background, not a card: white, with the active tab
     marked by weight and its white underline rather than by colour. */
  .tabs{border-bottom-color:rgba(255,255,255,.35);}
  .tabs button{color:var(--on-bg);font-weight:500;}
  .tabs button.active{font-weight:700;}
  header h1{color:var(--on-bg);}
  .panel > p{text-align:left;color:var(--on-bg);}
  .row{
    display:flex;align-items:center;gap:12px;padding:12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  }
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--avatar);object-fit:cover;flex:0 0 auto;}
  .who{flex:1;min-width:0;}
  .who .name{font-size:14px;font-weight:600;}
  .who .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;}
  .tag.off{background:rgba(0,0,0,.35);color:#ffffff;}
  /* A site's switches, under its name. */
  .switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer;}
  .switch input{margin:0;width:16px;height:16px;accent-color:var(--accent);}
  .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .actions button{width:auto;padding:6px 10px;font-size:12px;border-radius:8px;}
  .inline-form{display:flex;gap:8px;margin-bottom:14px;}
  .inline-form input{margin:0;}
  .inline-form button{width:auto;white-space:nowrap;}
  .secret{
    font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--field);
    border:1px solid var(--field-line);border-radius:10px;padding:12px;margin-bottom:12px;user-select:all;
  }
  .image-setting{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .image-setting h3{margin:0 0 4px;font-size:15px;}
  .image-setting .buttons{display:flex;gap:8px;}
  .image-setting .buttons button{width:auto;}
  #pageError:not(:empty){background:var(--card);border-radius:10px;padding:8px 10px;}
  .image-setting img{max-width:100%;max-height:120px;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0;}
  .image-setting p{text-align:left;margin-bottom:8px;}
  .image-setting label.upload{display:inline-block;width:auto;}
  .image-setting input[type=file]{display:none;}
  @media (max-width:520px){
    .row{flex-wrap:wrap;}
    .actions{width:100%;justify-content:flex-start;}
  }
</style>
</head>
<body class="mesh-bg">
<div class="wrap">
  <header>
    <div class="top">
      <!-- LOGO_IMG -->
      <a href="/profile" class="nav-btn" data-copy="admin.myProfile"></a>
    </div>
    <h1 data-copy="admin.heading"></h1>
  </header>
  <div class="tabs">
    <button type="button" data-tab="people" data-copy="admin.peopleTab"></button>
    <button type="button" data-tab="sites" data-copy="admin.sitesTab"></button>
    <button type="button" data-tab="settings" data-copy="admin.settingsTab"></button>
  </div>
  <div class="error" id="pageError"></div>

  <section class="panel" id="people">
    <p data-copy="admin.peopleHint"></p>
    <div id="peopleList"></div>
  </section>

  <section class="panel hidden" id="sites">
    <p data-copy="admin.sitesHint"></p>
    <form class="inline-form" id="addSiteForm">
      <input type="text" id="siteName" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit" id="addSiteBtn" data-copy="admin.addSite"></button>
    </form>
    <div id="siteList"></div>
  </section>

  <section class="panel hidden" id="settings">
    <div class="image-setting" data-image="logo-image">
      <h3 data-copy="admin.logoHeading"></h3>
      <p data-copy="admin.logoHint"></p>
      <img class="hidden" alt="">
      <div class="buttons">
        <label class="upload"><button type="button" class="secondary" data-copy="admin.upload"></button><input type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
        <button type="button" class="danger remove hidden" data-copy="admin.removeImage"></button>
      </div>
    </div>
    <div class="image-setting" data-image="backdrop-image">
      <h3 data-copy="admin.backdropHeading"></h3>
      <p data-copy="admin.backdropHint"></p>
      <img class="hidden" alt="">
      <div class="buttons">
        <label class="upload"><button type="button" class="secondary" data-copy="admin.upload"></button><input type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
        <button type="button" class="danger remove hidden" data-copy="admin.removeImage"></button>
      </div>
    </div>
  </section>
</div>

<!-- A secret shown once: a setup link or a site key. -->
<div class="sheet-bg hidden" id="sheet">
  <div class="card">
    <h2 id="sheetHeading"></h2>
    <p id="sheetHint"></p>
    <div class="secret" id="sheetSecret"></div>
    <div class="sheet-buttons">
      <button type="button" id="copyBtn" data-copy="admin.copy"></button>
      <button type="button" class="secondary" onclick="closeSheet()">Close</button>
    </div>
  </div>
</div>

<!-- Edit profile: every field the person can set, and their email. -->
<div class="sheet-bg hidden" id="editSheet">
  <form class="card edit-card" id="editForm">
    <h2 id="editHeading"></h2>
    <div class="name-row">
      <div class="field">
        <label class="field-label" for="editFirst" data-copy="profile.firstName"></label>
        <input type="text" id="editFirst" maxlength="60" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label" for="editLast" data-copy="profile.lastName"></label>
        <input type="text" id="editLast" maxlength="60" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="editEmail" data-copy="admin.email"></label>
      <input type="email" id="editEmail" maxlength="200" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label class="field-label" for="editPhone" data-copy="profile.phone"></label>
      <input type="tel" id="editPhone" maxlength="25" autocomplete="off">
    </div>
    <div class="field">
      <label class="field-label" for="editInstagram" data-copy="profile.instagram"></label>
      <label class="handle-field"><span class="handle-prefix" aria-hidden="true">@</span>
        <input type="text" id="editInstagram" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="field">
      <label class="field-label" for="editVenmo" data-copy="profile.venmo"></label>
      <label class="handle-field"><span class="handle-prefix" aria-hidden="true">@</span>
        <input type="text" id="editVenmo" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="field">
      <label class="field-label" for="editCashapp" data-copy="profile.cashapp"></label>
      <label class="handle-field"><span class="handle-prefix" aria-hidden="true">$</span>
        <input type="text" id="editCashapp" maxlength="21" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    </div>
    <p class="hint" data-copy="admin.emailHint" style="text-align:left;margin:0 0 12px;"></p>
    <div class="error" id="editError"></div>
    <div class="sheet-buttons">
      <button type="submit" id="editSave">Save</button>
      <button type="button" class="secondary" onclick="closeEdit()">Cancel</button>
    </div>
  </form>
</div>

<script src="/copy.js"></script>
<script src="/account.js"></script>
<script>
applyCopy();
document.getElementById('siteName').placeholder = t('admin.siteName');

// ---------------- Tabs (in the URL hash, so reload keeps the tab) ----------------
const TABS = ['people', 'sites', 'settings'];
function showTab(name){
  if (!TABS.includes(name)) name = 'people';
  TABS.forEach(tab => document.getElementById(tab).classList.toggle('hidden', tab !== name));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  if (name === 'people') loadPeople();
  if (name === 'sites') loadSites();
  if (name === 'settings') loadImages();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

async function api(method, url, body){
  const { res, data } = await sendJson(method, url, body);
  if (res.status === 401){ window.location.href = '/'; throw new Error('signed out'); }
  if (!res.ok) throw new Error(data.error || String(res.status));
  return data;
}

function fail(err){
  document.getElementById('pageError').textContent = t('admin.failed') + detail(err && err.message);
}

// ---------------- The once-only sheet ----------------
function openSheet(heading, hint, secret){
  document.getElementById('sheetHeading').textContent = heading;
  document.getElementById('sheetHint').textContent = hint;
  document.getElementById('sheetSecret').textContent = secret;
  document.getElementById('copyBtn').textContent = t('admin.copy');
  document.getElementById('sheet').classList.remove('hidden');
}
function closeSheet(){
  document.getElementById('sheet').classList.add('hidden');
  document.getElementById('sheetSecret').textContent = '';
}
// A tap outside the card closes it too.
document.getElementById('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
document.getElementById('copyBtn').addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(document.getElementById('sheetSecret').textContent);
    document.getElementById('copyBtn').textContent = t('admin.copied');
  }catch(e){}
});

function button(label, cls, onClick){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = label;
  b.addEventListener('click', () => onClick(b));
  return b;
}

// ---------------- People ----------------
async function loadPeople(){
  document.getElementById('pageError').textContent = '';
  let data;
  try{ data = await api('GET', '/api/admin/people'); }catch(e){ fail(e); return; }
  const list = document.getElementById('peopleList');
  list.innerHTML = '';
  // The admin first, then everyone by first and last name.
  const byName = (a, b) => (a.firstName + ' ' + a.lastName).localeCompare(b.firstName + ' ' + b.lastName, undefined, { sensitivity: 'base' });
  data.people.sort((a, b) => (b.id === data.adminPersonId) - (a.id === data.adminPersonId) || byName(a, b));
  data.people.forEach((p) => {
    const isAdmin = p.id === data.adminPersonId;
    const full = p.firstName + ' ' + p.lastName;
    const row = document.createElement('div');
    row.className = 'row';
    const img = document.createElement('img');
    img.className = 'avatar';
    img.alt = '';
    if (p.photoUrl) img.src = p.photoUrl;
    const who = document.createElement('div');
    who.className = 'who';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = full;
    if (isAdmin){
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = t('admin.adminTag');
      name.appendChild(tag);
    }
    // A quick sign-up, or an email changed here, that no code has proven.
    if (!p.emailVerified){
      const tag = document.createElement('span');
      tag.className = 'tag off';
      tag.textContent = t('admin.unverifiedTag');
      name.appendChild(tag);
    }
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = p.email + ' · ' + (p.passkeyCount === 0 ? t('admin.noPasskey')
      : p.passkeyCount === 1 ? t('admin.passkeysOne') : t('admin.passkeysMany', { count: p.passkeyCount }));
    who.append(name, sub);
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.appendChild(button(t('admin.editProfile'), 'secondary', () => openEdit(p)));
    actions.appendChild(button(t('admin.setupLink'), 'secondary', (b) => setupLink(p, b, false)));
    // Your own reset or delete would lock you out (see server.js).
    if (!isAdmin){
      actions.appendChild(button(t('admin.resetPasskeys'), 'secondary', (b) => setupLink(p, b, true)));
      actions.appendChild(button('Delete', 'danger', (b) => remove(p, b)));
    }
    row.append(img, who, actions);
    list.appendChild(row);
  });
}

// ---------------- Edit profile ----------------
let editing = null;
const PHONE_US = /^\+1(\d{3})(\d{3})(\d{4})$/;
function openEdit(p){
  editing = p;
  document.getElementById('editHeading').textContent = t('admin.editHeading', { name: p.firstName + ' ' + p.lastName });
  document.getElementById('editFirst').value = p.firstName;
  document.getElementById('editLast').value = p.lastName;
  document.getElementById('editEmail').value = p.email;
  const m = PHONE_US.exec(p.phone || '');
  document.getElementById('editPhone').value = m ? '(' + m[1] + ') ' + m[2] + '-' + m[3] : (p.phone || '');
  document.getElementById('editInstagram').value = p.instagram || '';
  document.getElementById('editVenmo').value = p.venmo || '';
  document.getElementById('editCashapp').value = p.cashapp || '';
  document.getElementById('editError').textContent = '';
  document.getElementById('editSheet').classList.remove('hidden');
  document.getElementById('editFirst').focus();
}
function closeEdit(){
  document.getElementById('editSheet').classList.add('hidden');
  editing = null;
}
document.getElementById('editSheet').addEventListener('click', (e) => { if (e.target.id === 'editSheet') closeEdit(); });

const EDIT_ERRORS = {
  bad_email: 'welcome.badEmail', conflict: 'admin.emailTaken', bad_phone: 'profile.badPhone',
  bad_instagram: 'profile.badInstagram', bad_venmo: 'welcome.badVenmo', bad_cashapp: 'profile.badCashapp',
  own_email: 'admin.ownEmail'
};
document.getElementById('editForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!editing) return;
  const errorEl = document.getElementById('editError');
  busy(document.getElementById('editSave'), errorEl, async () => {
    const { res, data } = await sendJson('PATCH', '/api/admin/people/' + encodeURIComponent(editing.id), {
      firstName: document.getElementById('editFirst').value,
      lastName: document.getElementById('editLast').value,
      email: document.getElementById('editEmail').value,
      phone: document.getElementById('editPhone').value,
      instagram: document.getElementById('editInstagram').value,
      venmoHandle: document.getElementById('editVenmo').value,
      cashapp: document.getElementById('editCashapp').value
    });
    if (res.status === 401){ window.location.href = '/'; return; }
    if (!res.ok){
      errorEl.textContent = EDIT_ERRORS[data.reason] ? t(EDIT_ERRORS[data.reason])
        : data.error === 'first and last name are both required' ? t('welcome.nameRequired')
        : t('admin.failed') + detail(data.error || res.status);
      return;
    }
    closeEdit();
    loadPeople();
  });
});

async function setupLink(p, btn, reset){
  const full = p.firstName + ' ' + p.lastName;
  if (reset && !confirm(t('admin.resetConfirm', { name: full }))) return;
  btn.disabled = true;
  try{
    const data = await api('POST', '/api/admin/people/' + p.id + (reset ? '/reset-passkeys' : '/setup-link'));
    openSheet(t('admin.linkHeading', { name: full }), t('admin.linkHint'), data.setupUrl);
  }catch(e){ fail(e); }
  btn.disabled = false;
  if (reset) loadPeople();
}

async function remove(p, btn){
  if (!confirm(t('admin.deleteConfirm', { name: p.firstName + ' ' + p.lastName }))) return;
  btn.disabled = true;
  try{ await api('DELETE', '/api/admin/people/' + p.id); }catch(e){ fail(e); }
  loadPeople();
}

// ---------------- Sites ----------------
async function loadSites(){
  document.getElementById('pageError').textContent = '';
  let data;
  try{ data = await api('GET', '/api/admin/apps'); }catch(e){ fail(e); return; }
  const list = document.getElementById('siteList');
  list.innerHTML = '';
  data.apps.forEach((a) => {
    const row = document.createElement('div');
    row.className = 'row';
    const who = document.createElement('div');
    who.className = 'who';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = a.name;
    if (a.revokedAt){
      const tag = document.createElement('span');
      tag.className = 'tag off';
      tag.textContent = t('admin.revoked');
      name.appendChild(tag);
    }
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = a.lastUsedAt ? t('admin.lastUsed', { date: formatDate(a.lastUsedAt) }) : t('admin.neverUsed');
    who.append(name, sub);
    who.appendChild(siteSwitch(a, 'allowsUnverified', 'admin.allowsUnverified'));
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.appendChild(button(t('admin.rekey'), 'secondary', async (b) => {
      if (!confirm(t('admin.rekeyConfirm', { name: a.name }))) return;
      b.disabled = true;
      try{
        const r = await api('POST', '/api/admin/apps/' + a.id + '/rekey');
        openSheet(t('admin.keyHeading', { name: a.name }), t('admin.keyHint'), r.key);
      }catch(e){ fail(e); }
      loadSites();
    }));
    if (!a.revokedAt){
      actions.appendChild(button(t('admin.revoke'), 'danger', async (b) => {
        if (!confirm(t('admin.revokeConfirm', { name: a.name }))) return;
        b.disabled = true;
        try{ await api('POST', '/api/admin/apps/' + a.id + '/revoke'); }catch(e){ fail(e); }
        loadSites();
      }));
    }
    row.append(who, actions);
    list.appendChild(row);
  });
}

// A checkbox for one of a site's switches, saved as soon as it's ticked.
function siteSwitch(a, field, copyKey){
  const label = document.createElement('label');
  label.className = 'switch';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = !!a[field];
  box.addEventListener('change', async () => {
    box.disabled = true;
    try{ await api('PATCH', '/api/admin/apps/' + a.id, { [field]: box.checked }); }
    catch(e){ fail(e); box.checked = !box.checked; }
    box.disabled = false;
  });
  const text = document.createElement('span');
  text.textContent = t(copyKey);
  label.append(box, text);
  return label;
}

document.getElementById('addSiteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('siteName');
  const btn = document.getElementById('addSiteBtn');
  btn.disabled = true;
  try{
    const r = await api('POST', '/api/admin/apps', { name: input.value });
    input.value = '';
    openSheet(t('admin.keyHeading', { name: r.app.name }), t('admin.keyHint'), r.key);
  }catch(err){ fail(err); }
  btn.disabled = false;
  loadSites();
});

// ---------------- Settings: logo and backdrop ----------------
function loadImages(){
  document.querySelectorAll('.image-setting').forEach(async (box) => {
    const img = box.querySelector('img');
    try{
      const data = await api('GET', '/api/admin/' + box.dataset.image);
      img.classList.toggle('hidden', !data.url);
      box.querySelector('.remove').classList.toggle('hidden', !data.url);
      if (data.url) img.src = data.url;
    }catch(e){ fail(e); }
  });
}

document.querySelectorAll('.image-setting').forEach((box) => {
  const input = box.querySelector('input[type=file]');
  box.querySelector('label.upload button').addEventListener('click', () => input.click());
  // Back to none: no backdrop (just the page's own background), or the
  // Canopy logo that ships with the service.
  box.querySelector('.remove').addEventListener('click', async (e) => {
    if (!confirm(t('admin.removeImageConfirm'))) return;
    e.currentTarget.disabled = true;
    try{ await api('DELETE', '/api/admin/' + box.dataset.image); }catch(err){ fail(err); }
    e.currentTarget.disabled = false;
    loadImages();
  });
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const form = new FormData();
    form.append('image', file);
    try{
      const res = await fetch('/api/admin/' + box.dataset.image, { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || String(res.status));
    }catch(e){ fail(e); }
    input.value = '';
    loadImages();
  });
});

showTab(location.hash.slice(1));
</script>
</body>
</html>
