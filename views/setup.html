<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Canopy</title>
<meta name="theme-color" content="#03120c">
<link rel="stylesheet" href="/account.css">
</head>
<!-- A setup link from the admin: one passkey for the person it names,
     then signed in. The code is the last part of this page's address. -->
<body class="centered mesh-bg" data-backdrop="__BACKDROP_URL__">
  <div class="edge-tint top" id="edgeTop" aria-hidden="true"></div>
  <div class="edge-tint bottom" id="edgeBottom" aria-hidden="true"></div>

  <div class="card hidden" id="setupCard">
    <!-- LOGO_IMG -->
    <h2 id="heading"></h2>
    <p data-copy="setup.hint"></p>
    <div class="error" id="setupError"></div>
    <button type="button" class="passkey-btn" id="setupBtn" data-copy="setup.button"></button>
  </div>

  <div class="card hidden" id="badCard">
    <!-- LOGO_IMG -->
    <p data-copy="setup.badLink"></p>
    <button type="button" onclick="window.location.href = '/'" data-copy="setup.goSignIn"></button>
  </div>

<script src="/copy.js"></script>
<script src="/vendor/simplewebauthn-browser-14.0.0/index.umd.min.js"></script>
<script src="/account.js"></script>
<script>
applyCopy();
setUpBackdrop();

const CODE = decodeURIComponent(window.location.pathname.split('/').pop() || '');

function show(id){
  ['setupCard', 'badCard'].forEach(c => document.getElementById(c).classList.toggle('hidden', c !== id));
}

(async function load(){
  try{
    const res = await fetch('/api/setup/' + encodeURIComponent(CODE));
    if (!res.ok){ show('badCard'); return; }
    const data = await res.json();
    document.getElementById('heading').textContent = t('setup.heading', { name: data.firstName });
    show('setupCard');
    if (!browserSupportsWebAuthn()){
      document.getElementById('setupError').textContent = t('welcome.noPasskeys');
      document.getElementById('setupBtn').disabled = true;
    }
  }catch(e){
    show('badCard');
  }
})();

document.getElementById('setupBtn').addEventListener('click', (e) => {
  const errorEl = document.getElementById('setupError');
  busy(e.currentTarget, errorEl, async () => {
    const { res, data } = await postJson('/api/auth/register/link', { code: CODE });
    if (data.reason === 'bad_link'){ show('badCard'); return; }
    if (!res.ok){ errorEl.textContent = t('welcome.failed') + detail(data.error || res.status); return; }
    if (await finishRegistration(data.options, errorEl)) window.location.href = '/profile';
  });
});
</script>
</body>
</html>
